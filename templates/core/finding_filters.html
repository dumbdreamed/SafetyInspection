{% load fa %}
<form method="get" class="panel finding-filters" aria-label="فیلتر اقدامات اصلاحی">
  <div class="finding-filter-heading"><div><strong>جست‌وجو و فیلتر نقص‌ها</strong><small>راننده یا اپراتور بر اساس تخصیص فعلی تجهیز انتخاب می‌شود.</small></div><span class="status-pill status-info"><span data-finding-count>{{ findings|length|fa }}</span> نتیجه</span></div>
  <div class="finding-filter-grid">
    <label>جست‌وجو<input class="field-input" name="q" value="{{ filters.q }}" placeholder="کد تجهیز، شرح نقص یا مسئول"></label>
    <label>تجهیز<select class="field-input" name="equipment"><option value="">همه تجهیزات</option>{% for eq in equipment_options %}<option value="{{ eq.pk }}" {% if filters.equipment == eq.pk|stringformat:'s' %}selected{% endif %}>{{ eq.asset_code }} · {{ eq.name }}</option>{% endfor %}</select></label>
    <label>نوع تجهیز<select class="field-input" name="type"><option value="">همه انواع</option>{% for type in equipment_types %}<option value="{{ type.pk }}" {% if filters.type == type.pk|stringformat:'s' %}selected{% endif %}>{{ type.name }}</option>{% endfor %}</select></label>
    <label>راننده / اپراتور فعلی<select class="field-input" name="driver"><option value="">همه رانندگان و اپراتورها</option>{% for person in drivers %}<option value="{{ person.pk }}" {% if filters.driver == person.pk|stringformat:'s' %}selected{% endif %}>{{ person.full_name }} · {{ person.employee_code }}</option>{% endfor %}</select></label>
    <label>ناحیه تجهیز<select class="field-input" name="area"><option value="">همه ناحیه‌ها</option><option value="none" {% if filters.area == 'none' %}selected{% endif %}>ناحیه ثبت نشده</option>{% for area in areas %}<option value="{{ area.pk }}" {% if filters.area == area.pk|stringformat:'s' %}selected{% endif %}>{{ area.name }}</option>{% endfor %}</select></label>
    <label>مسئول رفع نقص<select class="field-input" name="assignee"><option value="">همه مسئولان</option>{% for person in assignees %}<option value="{{ person.pk }}" {% if filters.assignee == person.pk|stringformat:'s' %}selected{% endif %}>{{ person.full_name }} · {{ person.employee_code }}</option>{% endfor %}</select></label>
    <label>وضعیت اقدام<select class="field-input" name="status"><option value="active" {% if selected_status == 'active' %}selected{% endif %}>همه اقدامات باز</option><option value="all" {% if selected_status == 'all' %}selected{% endif %}>همه وضعیت‌ها</option>{% for value,label in statuses %}<option value="{{ value }}" {% if selected_status == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label>
    <label>وضعیت بهره‌برداری تجهیز<select class="field-input" name="equipment_status"><option value="">همه وضعیت‌های تجهیز</option>{% for value,label in equipment_statuses %}<option value="{{ value }}" {% if filters.equipment_status == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label>
    <label>شدت<select class="field-input" name="severity"><option value="">همه شدت‌ها</option>{% for value,label in severities %}<option value="{{ value }}" {% if filters.severity == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label>
    <label>مهلت<select class="field-input" name="deadline"><option value="">همه مهلت‌ها</option><option value="overdue" {% if filters.deadline == 'overdue' %}selected{% endif %}>اقدامات معوق</option><option value="unset" {% if filters.deadline == 'unset' %}selected{% endif %}>بدون مهلت</option></select></label>
  </div>
  <div class="finding-filter-actions"><button class="button button-primary" type="submit">اعمال فیلتر</button><a class="button button-outline" href="{% url 'finding_list' %}">پاک‌کردن فیلترها</a></div>
</form>
